[project]
name = "dpd-updater"
version = "0.0.2"
description = "A standalone, cross-platform GUI application for managing DPD dictionary updates"
authors = [{ name = "bdhrs", email = "digitalpalidictionary@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "flet>=0.28.3",
    "requests>=2.31.0",
    "packaging>=23.2",
    "psutil>=7.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
    "pytest>=7.4.3",
    "ruff>=0.9.7",
    "icecream>=2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["*"]

[tool.hatch.build.targets.wheel]
include = ["*"]

[tool.ruff]
ignore = ["E501"]
target-version = "py310"
