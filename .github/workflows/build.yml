name: Build DPD Updater

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build (windows, macos, linux, all)'
        required: true
        default: 'all'
        type: choice

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller==6.18.0
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Build Windows
        run: |
          python build.py --platform windows
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpd-updater-windows
          path: dist/
  
  build-macos:
    name: Build macOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller==6.18.0
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Build macOS
        run: |
          python build.py --platform macos
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpd-updater-macos
          path: dist/
  
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller==6.18.0
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Build Linux
        run: |
          python build.py --platform linux
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpd-updater-linux
          path: dist/
