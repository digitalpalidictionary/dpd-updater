name: Build & Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build All Platforms & Create Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version Info
        id: version_info
        run: |
          # Get latest tag
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Read current version from pyproject.toml (more robust parsing)
          CURRENT=$(grep '^version = "' pyproject.toml | sed 's/version = "\([^"]*\)"/\1/')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
        shell: bash

      - name: Determine Next Version
        id: next_version
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          CURRENT="${{ steps.version_info.outputs.current }}"

          # Parse versions (remove 'v' prefix)
          TAG_VERSION=${TAG#v}
          CURRENT_VERSION=$CURRENT

          # Extract major, minor, patch from tag
          TAG_MAJOR=$(echo $TAG_VERSION | cut -d. -f1)
          TAG_MINOR=$(echo $TAG_VERSION | cut -d. -f2)
          TAG_PATCH=$(echo $TAG_VERSION | cut -d. -f3)

          # Extract major, minor, patch from current
          CURRENT_MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          CURRENT_MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          CURRENT_PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)

          # Check if version was manually bumped (major/minor change)
          if [[ $CURRENT_MAJOR -gt $TAG_MAJOR ]]; then
            # Major version bumped manually, use current version
            NEW_VERSION=$CURRENT_VERSION
          elif [[ $CURRENT_MAJOR -eq $TAG_MAJOR ]] && [[ $CURRENT_MINOR -gt $TAG_MINOR ]]; then
            # Minor version bumped manually, use current version
            NEW_VERSION=$CURRENT_VERSION
          else
            # No major/minor change, increment patch
            NEW_PATCH=$((TAG_PATCH + 1))
            NEW_VERSION="${TAG_MAJOR}.${TAG_MINOR}.${NEW_PATCH}"
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Update pyproject.toml
        run: |
          sed -i 's/version = ".*"/version = "${{ steps.next_version.outputs.version }}"/' pyproject.toml

      - name: Commit Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Bump version to ${{ steps.next_version.outputs.version }}"
          git tag ${{ steps.next_version.outputs.tag }}
          git push origin main
          git push origin ${{ steps.next_version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt

      - name: Build Windows
        run: |
          uv pip install pyinstaller==6.18.0
          python build.py --platform windows

      - name: Build macOS
        run: |
          python build.py --platform macos

      - name: Build Linux
        run: |
          python build.py --platform linux

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpd-updater-windows
          path: dist/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpd-updater-macos
          path: dist/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpd-updater-linux
          path: dist/

      - name: Create Draft Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.next_version.outputs.tag }}
          name: DPD Updater ${{ steps.next_version.outputs.version }}
          body: |
            ## ${{ steps.next_version.outputs.version }}

            Download the executable for your platform from the Actions tab.

          draft: true
          prerelease: false
