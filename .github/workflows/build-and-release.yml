name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next_version.outputs.version }}
      tag: ${{ steps.next_version.outputs.tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version Info
        id: version_info
        working-directory: resources/dpd-updater
        run: |
          # Get latest tag
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Read current version from pyproject.toml
          # Look for 'version = "x.y.z"' line specifically
          CURRENT=$(grep '^version = "' pyproject.toml | sed 's/version = "\([^"]*\)"/\1/')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
        shell: bash

      - name: Determine Next Version
        id: next_version
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          CURRENT="${{ steps.version_info.outputs.current }}"

          # Parse versions (remove 'v' prefix)
          TAG_VERSION=${TAG#v}
          CURRENT_VERSION=$CURRENT

          # Extract major, minor, patch from tag
          TAG_MAJOR=$(echo $TAG_VERSION | cut -d. -f1)
          TAG_MINOR=$(echo $TAG_VERSION | cut -d. -f2)
          TAG_PATCH=$(echo $TAG_VERSION | cut -d. -f3)

          # Extract major, minor, patch from current
          CURRENT_MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          CURRENT_MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          CURRENT_PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)

          # Check if version was manually bumped (major/minor change)
          if [[ $CURRENT_MAJOR -gt $TAG_MAJOR ]]; then
            NEW_VERSION=$CURRENT_VERSION
          elif [[ $CURRENT_MAJOR -eq $TAG_MAJOR ]] && [[ $CURRENT_MINOR -gt $TAG_MINOR ]]; then
            NEW_VERSION=$CURRENT_VERSION
          else
            # No major/minor change, increment patch
            NEW_PATCH=$((TAG_PATCH + 1))
            NEW_VERSION="${TAG_MAJOR}.${TAG_MINOR}.${NEW_PATCH}"
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Update pyproject.toml
        working-directory: resources/dpd-updater
        run: |
          # Safe replacement anchored to start of line
          sed -i 's/^version = ".*"/version = "${{ steps.next_version.outputs.version }}"/' pyproject.toml

      - name: Commit Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/dpd-updater/pyproject.toml
          git commit -m "Bump version to ${{ steps.next_version.outputs.version }}"
          git tag ${{ steps.next_version.outputs.tag }}
          git push origin HEAD
          git push origin ${{ steps.next_version.outputs.tag }}

  build:
    name: Build (${{ matrix.platform }})
    needs: bump-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact_name: dpd-updater-windows
            asset_path: resources/dpd-updater/dist/DPD-Updater.exe
          - platform: macos
            os: macos-latest
            artifact_name: dpd-updater-macos
            asset_path: resources/dpd-updater/dist/DPD Updater
          - platform: linux
            os: ubuntu-latest
            artifact_name: dpd-updater-linux
            asset_path: resources/dpd-updater/dist/dpd-updater

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "resources/dpd-updater/uv.lock"

      - name: Build Executable
        shell: bash
        run: |
          # uv run handles venv creation and dependency installation automatically
          uv run --project resources/dpd-updater python resources/dpd-updater/build.py --platform ${{ matrix.platform }}

      # For macOS, we might need to zip the .app bundle (if it's a directory)
      # PyInstaller --onefile on Mac produces a binary, but --windowed produces an .app bundle directory
      - name: Zip macOS App
        if: matrix.platform == 'macos'
        run: |
          cd resources/dpd-updater/dist
          zip -r "DPD Updater.app.zip" "DPD Updater.app"
          rm -rf "DPD Updater.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: resources/dpd-updater/dist/
          if-no-files-found: error

  release:
    name: Create Release
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display Artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: DPD Updater ${{ needs.bump-version.outputs.version }}
          draft: true
          prerelease: false
          files: |
            artifacts/dpd-updater-windows/DPD-Updater.exe
            artifacts/dpd-updater-linux/dpd-updater
            artifacts/dpd-updater-macos/DPD Updater.app.zip