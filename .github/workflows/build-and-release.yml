name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next_version.outputs.version }}
      tag: ${{ steps.next_version.outputs.tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version Info
        id: version_info
        run: |
          # Get latest tag or "none" if it doesn't exist
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Read current version from pyproject.toml
          CURRENT=$(grep '^version = "' pyproject.toml | sed 's/version = "\([^"]*\)"/\1/')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
        shell: bash

      - name: Determine Next Version
        id: next_version
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          CURRENT="${{ steps.version_info.outputs.current }}"

          if [[ "$TAG" == "none" ]]; then
            NEW_VERSION="0.0.1"
          else
            # Strip 'v' prefix
            TAG_V=${TAG#v}
            
            # Extract major.minor
            TAG_MAJOR_MINOR=$(echo $TAG_V | cut -d. -f1,2)
            CURRENT_MAJOR_MINOR=$(echo $CURRENT | cut -d. -f1,2)

            if [[ "$TAG_MAJOR_MINOR" != "$CURRENT_MAJOR_MINOR" ]]; then
              # Major/minor change in pyproject, use it
              NEW_VERSION=$CURRENT
            else
              # Bump patch
              TAG_PATCH=$(echo $TAG_V | cut -d. -f3)
              NEW_PATCH=$((TAG_PATCH + 1))
              NEW_VERSION="${TAG_MAJOR_MINOR}.${NEW_PATCH}"
            fi
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
        shell: bash

  build:
    name: Build (${{ matrix.platform }})
    needs: calculate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Continue other builds if one fails
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact_name: dpd-updater-windows
            asset_path: dist/DPD-Updater.exe
          - platform: macos
            os: macos-latest
            artifact_name: dpd-updater-macos
            asset_path: dist/DPD Updater
          - platform: linux
            os: ubuntu-latest
            artifact_name: dpd-updater-linux
            asset_path: dist/dpd-updater

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set Version
        run: |
          # Update pyproject.toml locally for the build using Python for cross-platform compatibility
          python -c "import re; p='pyproject.toml'; c=open(p, encoding='utf-8').read(); open(p,'w', encoding='utf-8').write(re.sub(r'(?m)^version = \".*\"', 'version = \"${{ needs.calculate-version.outputs.version }}\"', c))"
        shell: bash

      - name: Build Executable
        shell: bash
        run: |
          uv run python build.py --platform ${{ matrix.platform }}

      - name: Zip macOS App
        if: matrix.platform == 'macos'
        run: |
          cd dist
          zip -r "DPD Updater.app.zip" "DPD Updater.app"
          rm -rf "DPD Updater.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          if-no-files-found: warn

  release:
    name: Release
    needs: [calculate-version, build]
    if: always()  # Run even if some builds failed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Check Dependencies
        run: |
          # Check if calculate-version succeeded
          if [[ "${{ needs.calculate-version.result }}" != "success" ]]; then
            echo "Calculate version failed. Aborting."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false # Keep folder structure

      - name: Verify Artifacts
        id: verify
        run: |
          if [ -z "$(ls -A artifacts)" ]; then
             echo "No artifacts found! All builds must have failed."
             echo "Skipping release and commit."
             echo "proceed=false" >> $GITHUB_OUTPUT
             exit 1 # Fail the job to indicate error
          else
             echo "Artifacts found. Proceeding with release."
             echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Tag Release
        if: steps.verify.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.calculate-version.outputs.tag }}
          git push origin ${{ needs.calculate-version.outputs.tag }}

      - name: Create Release
        if: steps.verify.outputs.proceed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.calculate-version.outputs.tag }}
          name: DPD Updater ${{ needs.calculate-version.outputs.version }}
          draft: true
          prerelease: false
          files: |
            artifacts/dpd-updater-windows/DPD-Updater.exe
            artifacts/dpd-updater-linux/dpd-updater
            artifacts/dpd-updater-macos/DPD Updater.app.zip
